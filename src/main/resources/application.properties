# Server Configuration
server.port=8080

# Application Name
spring.application.name=CareTrack

# Database Configuration (MySQL)
spring.datasource.url=jdbc:mysql://localhost:3306/caretrack?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Disable default Spring Security password prompt on console until custom SecurityConfig is created in later steps
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.SecurityAutoConfiguration
